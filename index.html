<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <title>Not Defteri</title>

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #ffffff; height: 100vh; overflow: hidden; color: #333; }
        .hidden { display: none !important; }

        /* --- PROD LEVEL NOT DEFTERİ MASKESİ --- */
        #notepad-app { height: 100vh; display: flex; background-color: #fff; }
        
        /* Sol Sidebar (Not Listesi) */
        .np-sidebar { width: 300px; background-color: #f7f7f8; border-right: 1px solid #e1e1e3; display: flex; flex-direction: column; }
        .np-sidebar-header { padding: 20px 16px 12px; display: flex; justify-content: space-between; align-items: center; }
        .np-sidebar-header h2 { font-size: 20px; font-weight: 600; color: #111; }
        .np-new-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #007aff; }
        
        .np-search-box { padding: 0 16px 12px; }
        .np-search-box input { width: 100%; padding: 8px 12px; background-color: #e5e5ea; border: none; border-radius: 8px; font-size: 14px; outline: none; color: #333; }
        
        .np-list { flex: 1; overflow-y: auto; }
        .np-item { padding: 12px 16px; border-bottom: 1px solid #efeff1; cursor: pointer; transition: background 0.2s; }
        .np-item:hover, .np-item.active { background-color: #ebecf0; }
        .np-item-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; color: #222; }
        .np-item-snippet { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Sağ Alan (Not Düzenleyici) */
        .np-editor-area { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .np-editor-top { padding: 16px; border-bottom: 1px solid #efeff1; display: flex; justify-content: flex-end; }
        .np-delete-btn { background: none; border: none; color: #ff3b30; cursor: pointer; font-size: 14px; }
        .np-editor-content { flex: 1; padding: 24px; display: flex; flex-direction: column; }
        .np-title-input { font-size: 24px; font-weight: bold; border: none; outline: none; margin-bottom: 16px; width: 100%; color: #111; }
        .np-body-input { flex: 1; border: none; outline: none; font-size: 15px; resize: none; line-height: 1.5; color: #333; }
