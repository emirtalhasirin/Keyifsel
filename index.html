<script>
/* ============================================================
   SOHBETSEL — tek linkli, sunucusuz grup sohbeti
   Mimari: Herkes aynı sabit oda kimliğini (ROOM_PEER_ID) kullanır.
   Odayı ilk açan kişi "ev sahibi" olur, diğerleri ona bağlanır.
   Ev sahibi çıkarsa kalanlardan biri otomatik devralır.
   ============================================================ */

// Oda kimliği. Kendi odanızı ayırmak için bu değeri benzersiz bir şeyle değiştirin.
const ROOM_PEER_ID = 'sohbetsel-genel-oda-9f3k2x7';

const HISTORY_LIMIT = 200;      // saklanan mesaj sayısı
const KEEP_IMAGES   = 12;       // kalıcı saklanacak görsel sayısı
const $ = (id) => document.getElementById(id);

/* ---------- Depolama ---------- */
const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- Kullanıcı ---------- */
const COLORS = ['#f472b6','#fb923c','#eab308','#4ade80','#2dd4bf','#38bdf8','#a78bfa','#f87171'];
function colorFor(id) { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
function cleanName(s) { return String(s || '').replace(/[\u0000-\u001f]/g, '').trim().slice(0, 20) || 'Misafir'; }

let savedNick = store.get('sohbetsel_nick', null);
const me = {
    id: store.get('sohbetsel_uid', null) || (() => { const i = uid(); store.set('sohbetsel_uid', i); return i; })(),
    nickname: savedNick || ('Misafir' + Math.floor(1000 + Math.random() * 9000))
};
const pub = () => ({ id: me.id, nickname: me.nickname, color: colorFor(me.id) });

/* ---------- Durum ---------- */
let peer = null, conn = null, isHost = false, gen = 0;
let stopped = false, retryTimer = null, attempt = 0, connState = 'connecting';
const guests = new Map();   // (ev sahibi) bağlantı -> kullanıcı id
const users  = new Map();   // kullanıcı id -> {id,nickname,color}
const typers = new Map();   // kullanıcı id -> zamanlayıcı
const statusMap = {};       // mesaj id -> sending | sent | delivered

let messages = store.get('sohbetsel_msgs', []).filter(m => m && m.id && m.kind !== 'system');
const seen = new Set(messages.map(m => m.id));
let lastMsg = null, lastDay = null, unread = 0;
let muted = store.get('sohbetsel_muted', false);

/* ============================================================
   BAĞLANTI
   ============================================================ */
function teardown() {
    try { conn && conn.close(); } catch (e) {}
    try { peer && peer.destroy(); } catch (e) {}
    conn = null; peer = null; guests.clear(); isHost = false;
}

function start() {
    if (stopped) return;
    teardown();
    const g = ++gen;
    setConn('connecting', 'Bağlanılıyor…');
    let p;
    try { p = new Peer(ROOM_PEER_ID, { debug: 0 }); } catch (e) { scheduleRetry(); return; }
    peer = p;

    p.on('open', () => { if (g === gen) becomeHost(p, g); });
    p.on('error', (err) => {
        if (g !== gen) return;
        if (err.type === 'unavailable-id') { joinAsGuest(g); return; }
        if (connState === 'connected' && err.type !== 'peer-unavailable') return; // geçici sinyal hatası
        scheduleRetry();
    });
    p.on('disconnected', () => { if (g === gen && !p.destroyed) { try { p.reconnect(); } catch (e) {} } });
}

function becomeHost(p, g) {
    isHost = true; attempt = 0;
    guests.clear(); users.clear();
    users.set(me.id, pub());

    p.on('connection', (c) => {
        if (g !== gen) return;
        c.on('data', (d) => hostHandle(c, d));
        c.on('close', () => hostDrop(c));
        c.on('error', () => hostDrop(c));
    });

    setConn('connected');
    updateMembers();
}

function joinAsGuest(g) {
    try { peer && peer.destroy(); } catch (e) {}
    isHost = false; guests.clear();
    setConn('connecting', 'Odaya katılınıyor…');

    const p = new Peer({ debug: 0 });
    peer = p;
    p.on('open', () => {
        if (g !== gen) return;
        const c = p.connect(ROOM_PEER_ID, { reliable: true });
        conn = c;
        const timeout = setTimeout(() => { if (g === gen && !c.open) scheduleRetry(); }, 10000);
        c.on('open', () => {
            clearTimeout(timeout);
            if (g !== gen) return;
            c.send({ type: 'hello', user: pub(), history: historyForSync() });
        });
        c.on('data', (d) => { if (g === gen) guestHandle(d); });
        c.on('close', () => { clearTimeout(timeout); if (g === gen) scheduleRetry(); });
        c.on('error', () => { clearTimeout(timeout); if (g === gen) scheduleRetry(); });
    });
    p.on('error', (err) => {
        if (g !== gen) return;
        if (connState === 'connected' && err.type !== 'peer-unavailable') return;
        scheduleRetry();
    });
    p.on('disconnected', () => { if (g === gen && !p.destroyed) { try { p.reconnect(); } catch (e) {} } });
}

function scheduleRetry() {
    if (stopped || retryTimer) return;
    setConn('connecting', 'Yeniden bağlanılıyor…');
    users.clear(); updateMembers();
    const delay = 400 + Math.random() * 1500 + Math.min(attempt, 5) * 500;
    attempt++;
    retryTimer = setTimeout(() => { retryTimer = null; start(); }, delay);
}

/* ---------- Ev sahibi tarafı ---------- */
function broadcast(obj, except) {
    guests.forEach((_, c) => { if (c !== except && c.open) { try { c.send(obj); } catch (e) {} } });
}
function userList() { return [...users.values()]; }

function hostHandle(c, d) {
    if (!d || !d.type) return;

    if (d.type === 'hello') {
        const u = d.user || {};
        const id = String(u.id || '').slice(0, 40);
        if (!id) return;
        if (id === me.id) { c.send({ type: 'kicked', reason: 'Bu oda aynı hesapla başka bir sekmede açık.' }); setTimeout(() => c.close(), 300); return; }

        // Aynı kullanıcı başka bir sekmeden bağlıysa eskisini kapat
        guests.forEach((gid, oc) => {
            if (gid === id) {
                guests.delete(oc);
                try { oc.send({ type: 'kicked', reason: 'Bu oda başka bir sekmede açıldı.' }); } catch (e) {}
                setTimeout(() => { try { oc.close(); } catch (e) {} }, 300);
            }
        });

        const user = { id, nickname: cleanName(u.nickname), color: colorFor(id) };
        guests.set(c, id);
        users.set(id, user);

        mergeMessages(Array.isArray(d.history) ? d.history : []);
        renderAll();

        c.send({ type: 'welcome', users: userList(), history: historyForSync() });
        broadcast({ type: 'users', users: userList() }, c);
        pushSystem(`${user.nickname} odaya katıldı`, c);
        updateMembers();
        return;
    }

    const uidc = guests.get(c);
    if (!uidc) return;
    const u = users.get(uidc);

    switch (d.type) {
        case 'msg': {
            const m = sanitizeMsg(d.msg);
            if (!m) return;
            m.userId = uidc; m.nickname = u.nickname;
            if (!seen.has(m.id)) {
                receiveMessage(m);
                broadcast({ type: 'msg', msg: m }, c);
            }
            try { c.send({ type: 'ack', id: m.id }); } catch (e) {}
            break;
        }
        case 'typing':
            showTyping(uidc, !!d.isTyping);
            broadcast({ type: 'typing', userId: uidc, isTyping: !!d.isTyping }, c);
            break;
        case 'profile': {
            u.nickname = cleanName(d.nickname);
            broadcast({ type: 'users', users: userList() });
            updateMembers();
            break;
        }
    }
}

function hostDrop(c) {
    const id = guests.get(c);
    if (!id) return;
    guests.delete(c);
    const u = users.get(id);
    users.delete(id);
    showTyping(id, false);
    broadcast({ type: 'users', users: userList() });
    if (u) pushSystem(`${u.nickname} ayrıldı`);
    updateMembers();
}

// Sistem mesajı: yerelde göster + (ev sahibiyse) herkese ilet
function pushSystem(text, except) {
    addSystem(text);
    if (isHost) broadcast({ type: 'system', text }, except);
}

/* ---------- Katılımcı tarafı ---------- */
function guestHandle(d) {
    if (!d || !d.type) return;
    switch (d.type) {
        case 'welcome':
            users.clear();
            (d.users || []).forEach(u => users.set(u.id, { id: u.id, nickname: cleanName(u.nickname), color: colorFor(u.id) }));
            mergeMessages(Array.isArray(d.history) ? d.history : []);
            attempt = 0;
            setConn('connected');
            renderAll();
            updateMembers();
            break;
        case 'users':
            users.clear();
            (d.users || []).forEach(u => users.set(u.id, { id: u.id, nickname: cleanName(u.nickname), color: colorFor(u.id) }));
            updateMembers();
            break;
        case 'msg': {
            const m = sanitizeMsg(d.msg);
            if (m && !seen.has(m.id)) receiveMessage(m);
            break;
        }
        case 'ack': setTick(d.id, 'delivered'); break;
        case 'system': addSystem(String(d.text || '').slice(0, 120)); break;
        case 'typing': showTyping(String(d.userId), !!d.isTyping); break;
        case 'kicked':
            stopped = true;
            setConn('error', String(d.reason || 'Bağlantı sonlandırıldı.'), true);
            teardown();
            break;
    }
}

function sendToRoom(obj) {
    if (isHost) broadcast(obj);
    else if (conn && conn.open) { try { conn.send(obj); } catch (e) {} }
}

/* ============================================================
   MESAJ VERİSİ
   ============================================================ */
function sanitizeMsg(m) {
    if (!m || typeof m !== 'object') return null;
    const kind = m.kind === 'image' ? 'image' : (m.kind === 'text' ? 'text' : null);
    if (!kind || typeof m.id !== 'string' || m.id.length > 40) return null;
    let content = typeof m.content === 'string' ? m.content : '';
    let expired = false;
    if (kind === 'text') {
        if (!content || content.length > 4000) return null;
    } else {
        if (!content) expired = true;
        else if (!content.startsWith('data:image/') || content.length > 3_500_000) return null;
    }
    const ts = Number.isFinite(m.ts) ? m.ts : Date.now();
    return { id: m.id, userId: String(m.userId || '').slice(0, 40), nickname: cleanName(m.nickname), kind, content, ts, expired };
}

function mergeMessages(list) {
    let added = false;
    for (const raw of list) {
        const m = sanitizeMsg(raw);
        if (m && !seen.has(m.id)) { seen.add(m.id); messages.push(m); added = true; }
    }
    if (added) { messages.sort((a, b) => a.ts - b.ts); persist(); }
    return added;
}

function historyForSync() {
    return messages.filter(m => m.kind !== 'system').slice(-100);
}

function persist() {
    const real = messages.filter(m => m.kind !== 'system').slice(-HISTORY_LIMIT);
    if (real.length > HISTORY_LIMIT) messages = real;
    let imgs = 0;
    const out = [];
    for (let i = real.length - 1; i >= 0; i--) {
        const m = real[i];
        if (m.kind === 'image' && m.content) {
            if (imgs < KEEP_IMAGES) { imgs++; out.unshift(m); }
            else out.unshift({ ...m, content: '', expired: true });
        } else out.unshift(m);
    }
    if (!store.set('sohbetsel_msgs', out)) {
        store.set('sohbetsel_msgs', out.map(m => m.kind === 'image' ? { ...m, content: '', expired: true } : m));
    }
}

function receiveMessage(m) {
    if (!mergeMessages([m])) return;
    const stored = messages.find(x => x.id === m.id) || m;
    const wasNear = isNearBottom();
    appendMsgEl(stored);
    showTyping(stored.userId, false);
    if (wasNear && !document.hidden) scrollToBottom(true);
    else { unread++; updateUnread(); }
    if (stored.userId !== me.id) {
        chime();
        notify(stored);
    }
}

function addSystem(text) {
    const m = { id: 'sys-' + uid(), kind: 'system', text, ts: Date.now() };
    messages.push(m);
    const near = isNearBottom();
    appendMsgEl(m);
    if (near) scrollToBottom(true);
}

function sendMessage(kind, content) {
    if (!isHost && !(conn && conn.open)) {
        showToast('Bağlantı yok. Yeniden bağlanılıyor…', 'warning');
        return false;
    }
    const m = { id: uid(), userId: me.id, nickname: me.nickname, kind, content, ts: Date.now() };
    seen.add(m.id);
    messages.push(m);
    persist();
    statusMap[m.id] = 'sending';
    appendMsgEl(m);
    scrollToBottom(true);

    if (isHost) {
        broadcast({ type: 'msg', msg: m });
        setTick(m.id, guests.size > 0 ? 'delivered' : 'sent');
    } else {
        try { conn.send({ type: 'msg', msg: m }); } catch (e) { showToast('Mesaj gönderilemedi.', 'error'); }
    }
    return true;
}

function escapeHTML(s) {
    return String(s).replace(/[&<>'"]/g, t => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[t]));
}
function formatText(t) {
    return escapeHTML(t).replace(/(https?:\/\/[^\s<]+)/g,
        u => `<a href="${u}" target="_blank" rel="noopener noreferrer" class="underline text-sky-300 break-all">${u}</a>`);
}
const timeOf = (ts) => new Date(ts).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
const dayKey = (ts) => { const d = new Date(ts); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); };
function dayLabel(ts) {
    const t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
    const k = dayKey(ts);
    if (k === dayKey(t)) return 'Bugün';
    if (k === dayKey(y)) return 'Dün';
    return new Date(ts).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
}
function avatarHTML(name, color, size = 'w-8 h-8 text-xs') {
    return `<div class="${size} rounded-full flex items-center justify-center font-bold text-white shrink-0 shadow" style="background:${color}">${escapeHTML((name || '?').trim().charAt(0).toUpperCase())}</div>`;
}
function tickHTML(s) {
    if (s === 'sending')   return '<i class="fa-regular fa-clock"></i>';
    if (s === 'sent')      return '<i class="fa-solid fa-check"></i>';
    return '<i class="fa-solid fa-check-double text-sky-300"></i>';
}
function setTick(id, status) {
    statusMap[id] = status;
    const el = document.querySelector(`[data-tick="${CSS.escape(id)}"]`);
    if (el) el.innerHTML = tickHTML(status);
}

function appendMsgEl(m) {
    const list = $('messages');
    $('emptyState').classList.add('hidden');

    if (m.kind === 'system') {
        const d = document.createElement('div');
        d.className = 'text-center my-2 pop';
        d.innerHTML = `<span class="text-[11px] font-medium bg-slate-800/70 text-slate-400 px-3 py-1 rounded-full border border-slate-700/40">${escapeHTML(m.text)}</span>`;
        list.appendChild(d);
        lastMsg = null;
        return;
    }

    const dk = dayKey(m.ts);
    if (dk !== lastDay) {
        const s = document.createElement('div');
        s.className = 'text-center my-3';
        s.innerHTML = `<span class="text-[11px] font-semibold bg-slate-800/80 text-slate-300 px-3 py-1 rounded-full border border-slate-700/50">${dayLabel(m.ts)}</span>`;
        list.appendChild(s);
        lastDay = dk; lastMsg = null;
    }

    const mine = m.userId === me.id;
    const grouped = !!lastMsg && lastMsg.userId === m.userId && (m.ts - lastMsg.ts) < 300000;
    const color = colorFor(m.userId);
    const live = users.get(m.userId);
    const name = (live && live.nickname) || m.nickname;

    const row = document.createElement('div');
    row.className = `flex items-start gap-2 pop ${mine ? 'justify-end' : 'justify-start'} ${grouped ? 'mt-0.5' : 'mt-3'}`;

    const radius = mine ? (grouped ? 'rounded-2xl' : 'rounded-2xl rounded-tr-sm') : (grouped ? 'rounded-2xl' : 'rounded-2xl rounded-tl-sm');
    const skin = mine ? 'bg-gradient-to-br from-brand-600 to-indigo-600 text-white shadow-md shadow-indigo-950/30'
                      : 'bg-slate-800/90 text-slate-100 border border-slate-700/60';
    const st = statusMap[m.id] || 'delivered';
    const tick = mine ? `<span data-tick="${m.id}">${tickHTML(st)}</span>` : '';
    const nameHTML = (!mine && !grouped) ? `<div class="text-xs font-semibold mb-0.5" style="color:${color}">${escapeHTML(name)}</div>` : '';

    let inner;
    if (m.kind === 'image') {
        const body = (m.content && !m.expired)
            ? `<img class="rounded-xl w-full max-h-72 object-cover cursor-zoom-in" alt="Fotoğraf">`
            : `<div class="px-3 py-6 text-xs text-slate-400 flex items-center gap-2"><i class="fa-regular fa-image"></i> Fotoğraf artık mevcut değil</div>`;
        inner = `<div class="bubble w-64 max-w-[80%] sm:w-72 p-1 ${radius} ${skin}">${nameHTML ? `<div class="px-2 pt-1">${nameHTML}</div>` : ''}${body}<div class="meta-block">${timeOf(m.ts)}${tick}</div></div>`;
    } else {
        inner = `<div class="bubble max-w-[80%] min-w-0 sm:max-w-md px-3.5 py-2 ${radius} ${skin}">${nameHTML}<div class="text-[15px] leading-snug whitespace-pre-wrap" style="overflow-wrap:anywhere">${formatText(m.content)}</div><span class="meta">${timeOf(m.ts)}${tick}</span></div>`;
    }

    const avatar = mine ? '' : (grouped ? '<div class="w-8 shrink-0"></div>' : avatarHTML(name, color));
    row.innerHTML = avatar + inner;

    const img = row.querySelector('img');
    if (img) { img.src = m.content; img.addEventListener('click', () => openLightbox(m.content)); }

    list.appendChild(row);
    lastMsg = m;
}

function compressImage(file) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
            const max = 1280;
            const s = Math.min(1, max / Math.max(img.width, img.height));
            const w = Math.round(img.width * s), h = Math.round(img.height * s);
            const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
            cv.getContext('2d').drawImage(img, 0, 0, w, h);
            URL.revokeObjectURL(url);
            resolve(cv.toDataURL('image/jpeg', 0.78));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(); };
        img.src = url;
    });
}
async function handleImageSelect(e) {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (!isHost && !(conn && conn.open)) { showToast('Bağlantı yok. Yeniden bağlanılıyor…', 'warning'); return; }
    if (file.size > 20 * 1024 * 1024) { showToast('Dosya çok büyük (en fazla 20MB).', 'warning'); return; }
    try {
        const data = await compressImage(file);
        sendMessage('image', data);
    } catch (err) { showToast('Görsel işlenemedi.', 'error'); }
}

let audioCtx = null;
function chime() {
    if (muted) return;
    try {
        const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
        audioCtx = audioCtx || new A();
        const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
        o.type = 'sine';
        o.frequency.setValueAtTime(523.25, t);
        o.frequency.exponentialRampToValueAtTime(783.99, t + .09);
        g.gain.setValueAtTime(.1, t); g.gain.exponentialRampToValueAtTime(.001, t + .3);
        o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(t + .3);
    } catch (e) {}
}
function toggleSound() { muted = !muted; store.set('sohbetsel_muted', muted); refreshSoundBtn(); showToast(muted ? 'Bildirim sesi kapalı' : 'Bildirim sesi açık', 'info'); }
function refreshSoundBtn() {
    $('soundIcon').className = `fa-solid ${muted ? 'fa-bell-slash' : 'fa-bell'} w-9 text-center text-slate-300`;
    $('soundLabel').textContent = 'Bildirim sesi: ' + (muted ? 'kapalı' : 'açık');
}
function notify(m) {
    if (!document.hidden || !('Notification' in window) || Notification.permission !== 'granted') return;
    try { new Notification(m.nickname, { body: m.kind === 'image' ? '📷 Fotoğraf' : m.content.slice(0, 120), tag: 'sohbetsel' }); } catch (e) {}
}

function shareLink() {

    if (navigator.share && coarse) { navigator.share({ title: 'Sohbetsel', text: 'Sohbetsel odasına katıl!', url: link }).catch(() => {}); return; }
    const done = () => showToast('Link kopyalandı — paylaşabilirsin!', 'success');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done).catch(() => fallbackCopy(link, done));
    else fallbackCopy(link, done);
}
function fallbackCopy(text, cb) {
    const t = document.createElement('input'); document.body.appendChild(t); t.value = text; t.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(t); cb();
}

function showToast(message, type = 'info') {
    const palette = {
        info:    ['text-slate-100 border-slate-700', 'fa-circle-info text-indigo-400'],
        success: ['text-emerald-300 border-emerald-500/30', 'fa-circle-check text-emerald-400'],
        error:   ['text-rose-300 border-rose-500/30', 'fa-circle-exclamation text-rose-400'],
        warning: ['text-amber-300 border-amber-500/30', 'fa-triangle-exclamation text-amber-400']
    }[type] || [];
    const t = document.createElement('div');
    t.className = `flex items-center gap-2.5 max-w-full px-4 py-2.5 rounded-xl border bg-slate-900/95 text-xs font-semibold shadow-2xl backdrop-blur-md transition-all duration-300 opacity-0 -translate-y-2 ${palette[0]}`;
    t.innerHTML = `<i class="fa-solid ${palette[1]}"></i><span>${escapeHTML(message)}</span>`;
    $('toastContainer').appendChild(t);
    setTimeout(() => t.classList.remove('opacity-0', '-translate-y-2'), 10);
    setTimeout(() => { t.classList.add('opacity-0', '-translate-y-2'); setTimeout(() => t.remove(), 300); }, 3000);
}

/* ---------- Mobil klavye / ekran yüksekliği ---------- */
// Uygulama her zaman "görünen alan" kadar yer kaplar; klavye açılınca bu alan küçülür,
// yazma kutusu klavyenin hemen üstünde kalır, üst bar yerinden oynamaz.
let wasNear = true;
$('messages').addEventListener('scroll', () => { wasNear = isNearBottom(); });

function fitViewport(stick) {
    const vv = window.visualViewport;
    const app = $('app');
    const h = vv ? vv.height : window.innerHeight;
    app.style.height = Math.round(h) + 'px';

// Klavye animasyonu boyunca her karede ölçüyü güncelle (iOS'ta olay sonda geliyor)
let kbRaf = 0;
function trackKeyboard(ms) {
    cancelAnimationFrame(kbRaf);
    const stick = wasNear;
    const end = Date.now() + ms;
    (function tick() {
        fitViewport(stick);
        if (Date.now() < end) kbRaf = requestAnimationFrame(tick);
    })();
}

if (window.visualViewport) {
    visualViewport.addEventListener('resize', () => trackKeyboard(300));
    visualViewport.addEventListener('scroll', () => fitViewport(wasNear));
}
window.addEventListener('resize', () => trackKeyboard(300));
window.addEventListener('orientationchange', () => setTimeout(() => trackKeyboard(400), 200));
window.addEventListener('scroll', () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); });
input.addEventListener('focus', () => { trackKeyboard(800); setTimeout(() => scrollToBottom(true), 350); });
input.addEventListener('blur', () => trackKeyboard(600));
fitViewport(true);

// Sayfanın kendisi parmakla sürüklenip kaymasın (sadece mesaj listesi ve paneller kayabilsin)
document.addEventListener('touchmove', (e) => {
    if (e.touches.length > 1) return;
    if (!e.target.closest('#messages, #membersList, #messageInput')) e.preventDefault();
}, { passive: false });

window.addEventListener('online', () => { if (!stopped && connState !== 'connected') { clearTimeout(retryTimer); retryTimer = null; start(); } });
window.addEventListener('beforeunload', () => { try { peer && peer.destroy(); } catch (e) {} });

refreshMeAvatar();
refreshSoundBtn();
if (messages.length) renderAll();
updateMembers();
start();
if (!savedNick) openProfile(true);
</script>
</body>
</html>
