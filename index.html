<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notlarım</title>

    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        /* GENEL AYARLAR */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f4f9; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }

        /* MASKE: NOT DEFTERİ TASARIMI */
        #notepad-app { height: 100vh; background-color: #fdfdfd; display: flex; flex-direction: column; }
        .np-header { background-color: #ffcc00; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; cursor: pointer; user-select: none; }
        .np-search { padding: 15px; background: #eee; }
        .np-search input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; outline: none; }
        .np-notes { flex: 1; padding: 20px; overflow-y: auto; background: repeating-linear-gradient(#fdfdfd, #fdfdfd 29px, #e1e1e1 30px); line-height: 30px; font-size: 18px; color: #333; }
        .np-fab { position: absolute; bottom: 30px; right: 30px; width: 60px; height: 60px; background-color: #ffcc00; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; color: black; font-weight: bold; }

        /* GİZLİ SOHBETSEL TASARIMI */
        #chat-app { height: 100vh; background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; }
        .chat-header { background-color: #161b22; padding: 15px 20px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .chat-title { font-size: 20px; font-weight: bold; color: #58a6ff; }
        .status { font-size: 12px; color: #8b949e; margin-top: 5px; }
        .copy-btn { background-color: #238636; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
        
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 10px 15px; border-radius: 12px; font-size: 15px; word-wrap: break-word; }
        .msg.sent { background-color: #1f6feb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.received { background-color: #21262d; color: #c9d1d9; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #30363d; }
        
        .chat-input-area { padding: 15px; background-color: #161b22; border-top: 1px solid #30363d; display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 12px; background-color: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; font-size: 15px; outline: none; }
        .chat-input-area button { background-color: #1f6feb; color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. GÖRÜNÜM: SAHTE NOT DEFTERİ -->
    <div id="notepad-app">
        <!-- Gizli Tetikleyici: Bu başlığa 3 kere tıklanacak -->
        <div class="np-header" id="np-header">📝 Notlarım</div>
        
        <div class="np-search">
            <!-- Gizli Tetikleyici: Buraya 1234 yazılacak -->
            <input type="text" id="np-search-input" placeholder="Notlarda ara...">
        </div>
        <div class="np-notes">
            Marketten alınacaklar...<br>
            Fizik formülleri özeti.<br>
            Toplantı notları 14:00<br>
        </div>
        <div class="np-fab">+</div>
    </div>

    <!-- 2. GÖRÜNÜM: GERÇEK SOHBETSEL (Başlangıçta gizli) -->
    <div id="chat-app" class="hidden">
        <div class="chat-header">
            <div>
                <div class="chat-title">Sohbetsel</div>
                <div class="status" id="status-text">Sistem başlatılıyor...</div>
            </div>
            <button class="copy-btn" id="copy-btn">Sohbet Linkini Kopyala</button>
        </div>
        <div class="chat-messages" id="messages"></div>
        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="Güvenli mesaj yaz..." autocomplete="off">
            <button id="send-btn">Gönder</button>
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // MASKE (GİZLENME) KODLARI
        // ----------------------------------------------------
        const notepadApp = document.getElementById('notepad-app');
        const chatApp = document.getElementById('chat-app');
        const header = document.getElementById('np-header');
        const searchInput = document.getElementById('np-search-input');
        
        let clickCount = 0;
        let clickTimer;

        // Sohbeti Gösteren Fonksiyon
        function revealChat() {
            notepadApp.classList.add('hidden');
            chatApp.classList.remove('hidden');
            document.title = "Sohbetsel - Güvenli"; // Sekme adını değiştir
            initChat(); // PeerJS'i başlat
        }

        // Yöntem 1: Başlığa 3 kez tıklama
        header.addEventListener('click', () => {
            clickCount++;
            clearTimeout(clickTimer);
            if (clickCount >= 3) {
                revealChat();
                clickCount = 0;
            }
            clickTimer = setTimeout(() => { clickCount = 0; }, 1500);
        });

        // Yöntem 2: Arama çubuğuna şifre (1234) yazma
        searchInput.addEventListener('input', (e) => {
            if (e.target.value === '1234') {
                revealChat();
                e.target.value = '';
            }
        });

        // EĞER SİTEYE LİNK İLE GELDİYSE DİREKT SOHBETİ AÇ (Maskeyi Es Geç)
        const urlParams = new URLSearchParams(window.location.search);
        const roomToJoin = urlParams.get('room');
        if (roomToJoin) {
            revealChat();
        }

        // ----------------------------------------------------
        // P2P SOHBET (PEERJS) KODLARI
        // ----------------------------------------------------
        let peer;
        let conn;
        const statusText = document.getElementById('status-text');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const copyBtn = document.getElementById('copy-btn');
        let myRoomId = '';

        function initChat() {
            if (peer) return; // Zaten çalışıyorsa durdur
            
            peer = new Peer(); // Ücretsiz P2P sunucusuna bağlan

            peer.on('open', (id) => {
                if (roomToJoin) {
                    // MİSAFİR: Bir linke tıklayarak geldi.
                    statusText.innerText = "Karşı tarafa bağlanılıyor...";
                    conn = peer.connect(roomToJoin);
                    setupConnection();
                    copyBtn.style.display = 'none'; // Misafirin link kopyalamasına gerek yok
                } else {
                    // KURUCU: Kendi kendine gizli menüyü açtı.
                    myRoomId = id;
                    statusText.innerText = "Link kopyalayıp arkadaşına gönder.";
                }
            });

            // Kurucu için: Biri linke tıklayıp bağlandığında
            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });
        }

        function setupConnection() {
            // Bağlantı başarılı olduğunda
            conn.on('open', () => {
                statusText.innerText = "Bağlandı! Sohbet gizli ve şifrelidir.";
                statusText.style.color = "#3fb950"; // Yeşil renk
            });

            // Karşıdan mesaj geldiğinde
            conn.on('data', (data) => {
                addMessage(data, 'received');
                playChime(); // Ses çıkar
            });
            
            // Karşı taraf çıkarsa
            conn.on('close', () => {
                statusText.innerText = "Bağlantı koptu. Karşı taraf sayfayı kapattı.";
                statusText.style.color = "#f85149"; // Kırmızı renk
            });
        }

        // Ekrana Mesaj Ekleme
        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = 'msg ' + type;
            div.innerText = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight; // Hep en alta kaydır
        }

        // Mesaj Gönderme Butonu
        function sendMessage() {
            const text = msgInput.value.trim();
            if (text && conn && conn.open) {
                conn.send(text);
                addMessage(text, 'sent');
                msgInput.value = '';
            } else if (!conn || !conn.open) {
                alert("Henüz kimseyle bağlı değilsin! Linki arkadaşına gönderip bağlanmasını bekle.");
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Link Kopyalama Butonu
        copyBtn.addEventListener('click', () => {
            if (!myRoomId) return alert("Bağlantı henüz hazır değil, 1 saniye bekle.");
            
            const baseUrl = window.location.href.split('?')[0];
            const inviteLink = baseUrl + "?room=" + myRoomId;
            
            navigator.clipboard.writeText(inviteLink).then(() => {
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "Kopyalandı!";
                setTimeout(() => { copyBtn.innerText = originalText; }, 2000);
            });
        });

        // Gelen Mesaj Sesi
        function playChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }
    </script>
</body>
